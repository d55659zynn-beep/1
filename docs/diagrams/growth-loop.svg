<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" width="100%" role="img">
<title>用户增长闭环</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="180" y="40" width="320" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="340" y="58" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#B5D4F4">1. 流量进入</text>
<text x="340" y="78" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#85B7EB">搜索收录 · 公众号 · 分享卡片</text>
<line x1="340" y1="96" x2="340" y2="152" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="180" y="156" width="320" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="340" y="174" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#B5D4F4">2. 新客首单转化</text>
<text x="340" y="194" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#85B7EB">新人券 · 首单立减 · 限时秒杀</text>
<line x1="340" y1="212" x2="340" y2="268" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="180" y="272" width="320" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="340" y="290" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB">3. 分享裂变</text>
<text x="340" y="310" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#5DCAA5">拼团 · 邀请有礼 · 分销海报</text>
<line x1="340" y1="328" x2="340" y2="384" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="180" y="388" width="320" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="340" y="406" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#B5D4F4">4. 订阅消息召回</text>
<text x="340" y="426" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#85B7EB">发货通知 · 降价 · 券到期提醒</text>
<line x1="340" y1="444" x2="340" y2="500" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="180" y="504" width="320" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="340" y="522" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#B5D4F4">5. 复购与会员</text>
<text x="340" y="542" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#85B7EB">积分 · 会员等级 · 专属券</text>
<path d="M500 300 C 590 300 590 68 500 68" fill="none" stroke="#5DCAA5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="608" y="184" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB">老带新回流</text>
</g>
</svg>
